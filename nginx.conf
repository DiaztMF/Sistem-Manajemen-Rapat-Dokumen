worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    client_max_body_size 25M;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Nginx temp paths di /tmp agar non-root www-data bisa menulis buffer upload
    client_body_temp_path /tmp/client_temp 1 2;
    proxy_temp_path /tmp/proxy_temp 1 2;
    fastcgi_temp_path /tmp/fastcgi_temp 1 2;

    # Reverse proxy header mapping Render
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        # Listen dinamis port Render (di-inject via envsubst saat container startup)
        listen ${PORT:-80};
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Anti-Clickjacking & MIME-Sniffing Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Health check endpoint Render (/up)
        location = /up {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Cache file statis pre-built Vite & publik (1 tahun immutable)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Cegah akses ke file tersembunyi (.env, .git, dll)
        location ~ /\. {
            deny all;
        }

        # Rute utama Laravel SPA (Inertia)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Arahkan eksekusi PHP ke PHP-FPM daemon
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;

            # Anti Mixed-Content & SSL Headers injection
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTPS $http_x_forwarded_proto;
        }
    }
}
